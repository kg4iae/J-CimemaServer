<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#030407" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa771c" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(212, 175, 55, 0.25)" />
      <stop offset="100%" stop-color="rgba(212, 175, 55, 0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="url(#vignette)" />

  <!-- Subtle Projector Light Cone Beam -->
  <polygon points="960,0 200,1080 1720,1080" fill="url(#beamGrad)" />

  <!-- Art Deco Outer Border Frame -->
  <rect x="80" y="60" width="1760" height="960" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4" />
  <rect x="96" y="76" width="1728" height="928" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.2" />

  <!-- Corner Deco Accents -->
  <path d="M 80 120 L 140 120 L 140 60" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 1840 120 L 1780 120 L 1780 60" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 80 960 L 140 960 L 140 1020" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 1840 960 L 1780 960 L 1780 1020" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Center Emblem Group -->
  <g transform="translate(960, 480)" text-anchor="middle">
    <!-- Outer Ring -->
    <circle r="190" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />
    <circle r="176" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8 6" opacity="0.5" />
    
    <!-- Film Reel Center Spokes -->
    <circle r="60" fill="#0d1017" stroke="url(#goldGrad)" stroke-width="4" />
    <circle r="22" fill="url(#goldGrad)" />
    
    <!-- Film Reel Cutouts -->
    <circle cx="0" cy="-115" r="32" fill="#0d1017" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="100" cy="-58" r="32" fill="#0d1017" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="100" cy="58" r="32" fill="#0d1017" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="115" r="32" fill="#0d1017" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="-100" cy="58" r="32" fill="#0d1017" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="-100" cy="-58" r="32" fill="#0d1017" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Projector Rays Motif -->
    <g opacity="0.6">
      <line x1="-300" y1="0" x2="-220" y2="0" stroke="url(#goldGrad)" stroke-width="2" />
      <line x1="220" y1="0" x2="300" y2="0" stroke="url(#goldGrad)" stroke-width="2" />
      <line x1="-280" y1="-80" x2="-220" y2="-60" stroke="url(#goldGrad)" stroke-width="1.5" />
      <line x1="220" y1="-60" x2="280" y2="-80" stroke="url(#goldGrad)" stroke-width="1.5" />
      <line x1="-280" y1="80" x2="-220" y2="60" stroke="url(#goldGrad)" stroke-width="1.5" />
      <line x1="220" y1="60" x2="280" y2="80" stroke="url(#goldGrad)" stroke-width="1.5" />
    </g>
  </g>

  <!-- Typography -->
  <g fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">
    <text x="960" y="750" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="16">
      THE MAJESTIC CINEMA
    </text>
    <text x="960" y="805" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="10" fill="#e5c158" opacity="0.85">
      FEATURE PRESENTATION AUDITORIUM
    </text>
    <text x="960" y="855" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" letter-spacing="6" fill="#a0aab8" opacity="0.65">
      SILVER SCREEN DIGITAL CINEMA • STANDBY
    </text>
  </g>
</svg>
