name: Build Docker Container and Projector .deb Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-projector-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build cinemabooth-projector_1.0.0_amd64.deb
        run: |
          npx tsx -e "
            import fs from 'node:fs';
            import { buildProjectorDebPackage } from './server/debBuilder.ts';
            const buf = buildProjectorDebPackage({
              serverUrl: 'http://cinemabooth.local:3000',
              deviceName: 'CinemaBooth Projector',
              audioProfile: 'optical-51-ac3',
              spdifCard: '0',
              resolution: 'auto',
              theaterName: 'Grand Majestic Cinema'
            });
            fs.writeFileSync('cinemabooth-projector_1.0.0_amd64.deb', buf);
          "
          dpkg-deb --info cinemabooth-projector_1.0.0_amd64.deb
          dpkg-deb --contents cinemabooth-projector_1.0.0_amd64.deb

      - name: Upload Projector .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinemabooth-projector-amd64-deb
          path: cinemabooth-projector_1.0.0_amd64.deb
